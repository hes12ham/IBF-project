<style>

  .cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.cal-month{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}.cal-month h3{margin:0 0 8px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal-wd{font-size:.7rem;color:var(--muted);padding:2px 0}.cal-d{border:none;background:var(--soft);border-radius:6px;padding:7px 0;font-size:.8rem;cursor:pointer;font-family:inherit;color:var(--text)}.cal-d:hover{outline:2px solid var(--primary)}.cal-on{background:var(--primary);color:#fff;font-weight:800}.cal-today{box-shadow:inset 0 0 0 2px var(--accent)}.cal-empty{visibility:hidden;cursor:default}

const netErr=e=>!!e&&(e.code==="auth/network-request-failed"||e.name==="TypeError"||/network|failed to fetch|timeout|load failed/i.test(String(e.message||"")));
async function withRetry(fn,n){let last;for(let i=0;i<=n;i++){try{return await fn();}catch(e){last=e;if(!netErr(e)||i===n)throw e;await new Promise(r=>setTimeout(r,1200*(i+1)));}}throw last;}
async function _tok(){return firebase.auth().currentUser.getIdToken();}
function _toFV(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(typeof v==='string')return{stringValue:v};if(Array.isArray(v))return{arrayValue:{values:v.map(_toFV)}};if(typeof v==='object'){const f={};for(const k in v)if(v.hasOwnProperty(k))f[k]=_toFV(v[k]);return{mapValue:{fields:f}};}return{stringValue:String(v)};}
function _fromFV(v){if(!v)return null;if('nullValue' in v)return null;if('booleanValue' in v)return v.booleanValue;if('integerValue' in v)return Number(v.integerValue);if('doubleValue' in v)return v.doubleValue;if('stringValue' in v)return v.stringValue;if('arrayValue' in v)return(v.arrayValue.values||[]).map(_fromFV);if('mapValue' in v){const o={};for(const k in(v.mapValue.fields||{}))o[k]=_fromFV(v.mapValue.fields[k]);return o;}return null;}
function _docParse(d){const o={id:d.name.split('/').pop()};for(const k in(d.fields||{}))o[k]=_fromFV(d.fields[k]);return o;}
function _objFields(o){const f={};for(const k in o)if(k!=='id')f[k]=_toFV(o[k]);return f;}

async function restGet(col,docId){const t=await _tok();const r=await fetch(FS_BASE+'/'+col+'/'+docId,{headers:{'Authorization':'Bearer '+t}});if(r.status===404)return null;if(!r.ok)throw new Error('GET '+r.status+': '+(await r.text()).slice(0,200));return _docParse(await r.json());}
async function restList(col){const t=await _tok();const docs=[];let pt='';do{const u=FS_BASE+'/'+col+'?pageSize=300'+(pt?'&pageToken='+pt:'');const r=await fetch(u,{headers:{'Authorization':'Bearer '+t}});if(!r.ok)throw new Error('LIST '+r.status+': '+(await r.text()).slice(0,200));const j=await r.json();(j.documents||[]).forEach(d=>docs.push(_docParse(d)));pt=j.nextPageToken||'';}while(pt);return docs;}
async function restAdd(col,data){const t=await _tok();const r=await fetch(FS_BASE+'/'+col,{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:_objFields(data)})});if(!r.ok)throw new Error('ADD '+r.status+': '+(await r.text()).slice(0,200));return _docParse(await r.json());}
async function restSet(col,docId,data){const t=await _tok();const r=await fetch(FS_BASE+'/'+col+'/'+docId,{method:'PATCH',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:_objFields(data)})});if(!r.ok)throw new Error('SET '+r.status+': '+(await r.text()).slice(0,200));}
async function restUpdate(col,docId,data){const t=await _tok();const mask=Object.keys(data).filter(k=>k!=='id').map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&');const r=await fetch(FS_BASE+'/'+col+'/'+docId+'?'+mask,{method:'PATCH',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:_objFields(data)})});if(!r.ok)throw new Error('UPD '+r.status+': '+(await r.text()).slice(0,200));}
async function restDel(col,docId){const t=await _tok();const r=await fetch(FS_BASE+'/'+col+'/'+docId,{method:'DELETE',headers:{'Authorization':'Bearer '+t}});if(!r.ok&&r.status!==404)throw new Error('DEL '+r.status+': '+(await r.text()).slice(0,200));}

function parseVolunteerSheet(rows){const KW={name:["الاسم","الأسم","اسم","الاسم رباعي","الأسم رباعي","الاسم الرباعي","اسم المتطوع","name","full name","fullname"],code:["الكود","كود","code","رقم الكود"],phone:["التليفون","الهاتف","الموبايل","رقم التليفون","رقم الهاتف","رقم الموبايل","phone","mobile","tel"],national_id:["البطاقة","رقم البطاقة","الرقم القومي","الرقم القومى","رقم قومي","national id","nationalid","id"],commitment:["الالتزام","درجة الالتزام","التقييم","commitment","score"]};const norm=s=>String(s==null?"":s).trim().toLowerCase();const hit=(cell,list)=>{const c=norm(cell);return c!==""&&list.some(k=>{const n=norm(k);return c===n||c.includes(n);});};const skipTitles=["كشف  متطوعين  قافلة","مؤسسة ابراهيم أحمد بدران للأعمال الخيرية","تقييم المتطوعين","التقرير الفني للقافلة","التقرير الفني للقافله"];let headerIdx=-1,map={};for(let i=0;i<rows.length;i++){const r=rows[i]||[];if(r.some(c=>hit(c,KW.name))){headerIdx=i;r.forEach((c,ci)=>{for(const f in KW){if(map[f]===undefined&&hit(c,KW[f]))map[f]=ci;}});break;}}const out=[];const rd=(r,i)=>(i!==undefined&&r[i]!=null&&String(r[i]).trim()!=="")?String(r[i]).trim():null;if(headerIdx>=0&&map.name!==undefined){for(let i=headerIdx+1;i<rows.length;i++){const r=rows[i]||[];const name=rd(r,map.name);if(!name||skipTitles.includes(name)||hit(name,KW.name))continue;out.push({full_name:name,code:rd(r,map.code),phone:rd(r,map.phone),national_id:rd(r,map.national_id),commitment_score:map.commitment!==undefined?toInt(r[map.commitment]):null});}}else{rows.forEach(r=>{if(!r||!r[0])return;const name=String(r[0]).trim();if(!name||skipTitles.includes(name)||hit(name,KW.name))return;out.push({full_name:name,code:rd(r,1),phone:rd(r,2),national_id:rd(r,3),commitment_score:toInt(r[4])});});}return out;}

function exportVols(list,fname){if(!list.length){setFlash(lang==="ar"?"لا يوجد متطوعون للتصدير":"Nothing to export","error");render();return;}const data=[["الأسم رباعي","الكود","رقم التليفون","رقم البطاقة","القافلة","المشروع","الإيميل","صورة البطاقة"]];list.forEach(v=>{const pn=volLabels(v).map(x=>x.split(" › ")[0]).filter((x,i,a)=>a.indexOf(x)===i).join(" | ");const cvn=volLabels(v).map(x=>x.split(" › ")[1]||"").filter(Boolean).join(" | ");data.push([v.full_name,v.code||"",v.phone||"",v.national_id||"",cvn,pn,v.email||"",v.id_photo||""]);});const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Volunteers");XLSX.writeFile(wb,fname);}

 const ex=[["project_id","القافلة","الاسم","الدور","بدل وجبة","بدل سفر","بدل انتقال","ملاحظة","التاريخ"]];state.projects.forEach(p=>(p.expenses||[]).forEach(e=>ex.push([p.id,e.caravan||"",e.name,e.role||"",+e.meal||0,+e.travel||0,+e.transport||0,e.note||"",e.date||""])));add("Expenses",ex);add("Clinics",[["id","الاسم","المحافظة","المدينة","الممول"],...state.clinics.map(c=>[c.id,c.name,c.governorate||"",c.city||"",c.funder||""])]);const mr=[["clinic_id","العيادة","العضو"]];state.clinics.forEach(c=>(c.members||[]).forEach(m=>mr.push([c.id,c.name,m.name])));add("ClinicMembers",mr);const er=[["clinic_id","العيادة","العضو","التاريخ","المبلغ","ملاحظة"]];state.clinics.forEach(c=>(c.entries||[]).forEach(e=>er.push([c.id,c.name,e.member,e.date||"",+e.amount||0,e.note||""])));add("Allowances",er);add("Users",[["المستخدم","الدور","صلاحية الحذف","المشاريع المعيّنة"],...state.users.map(u=>[u.username||u.email,u.role,u.canDelete?"نعم":"لا",(u.assigned||[]).map(a=>typeof a==="object"?a.id:a).join(",")])]);XLSX.writeFile(wb,"IBF_database_"+new Date().toISOString().slice(0,10)+".xlsx");}

const volCvs=v=>{const s=new Set();(v.assignments||[]).forEach(a=>{if(a&&a.project_id&&a.caravan)s.add(cvKey(a.project_id,a.caravan));});if(v.project_id&&v.caravan)s.add(cvKey(v.project_id,v.caravan));(v.participations||[]).forEach(x=>{if(x&&x.project_id&&x.caravan)s.add(cvKey(x.project_id,x.caravan));});(v.cv_removed||[]).forEach(k=>{if(!(v.assignments||[]).some(a=>cvKey(a.project_id,a.caravan)===k))s.delete(k);});return s;};
const inCv=(v,pid,cn)=>volCvs(v).has(cvKey(pid,cn));
const cvVolsOf=(pid,cn)=>state.volunteers.filter(v=>inCv(v,pid,cn));
const inPrj=(v,pid)=>v.project_id===pid||[...volCvs(v)].some(k=>k.startsWith(pid+"~"));
const roleOf=(v,pid,cn)=>{const m=v.convoy_roles,k=cvKey(pid,cn);if(m&&(k in m))return m[k]||"";return(v.project_id===pid&&v.caravan===cn)?(v.convoy_role||""):"";};
const prjCvNames=p=>[...new Set([...(p.caravans||[]).map(c=>c.name),...state.volunteers.flatMap(v=>[...volCvs(v)].filter(k=>k.startsWith(p.id+"~")).map(k=>k.slice(p.id.length+1)))])];
const volLabels=v=>{const out=[];volCvs(v).forEach(k=>{const i=k.indexOf("~");const pr=state.projects.find(p=>p.id===k.slice(0,i));if(pr)out.push(pr.name+" › "+k.slice(i+1));});if(v.project_id&&!v.caravan){const pr=state.projects.find(p=>p.id===v.project_id);if(pr&&!out.some(x=>x.startsWith(pr.name+" ›")))out.push(pr.name);}return out;};
const volCvPatch=(v,pid,cn,add)=>{const key=cvKey(pid,cn);const as=(v.assignments||[]).filter(a=>cvKey(a.project_id,a.caravan)!==key);const rm=(v.cv_removed||[]).filter(k=>k!==key);const patch={};if(add){as.push({project_id:pid,caravan:cn});patch.project_id=pid;patch.caravan=cn;}else{rm.push(key);if(v.project_id===pid&&v.caravan===cn){patch.project_id=null;patch.caravan=null;}}patch.assignments=as;patch.cv_removed=rm;return patch;};
const govArr=o=>{if(!o)return[];if(Array.isArray(o.governorates)&&o.governorates.length)return o.governorates;const s=o.governorate||o.location||"";return String(s).split(/\s*[,،]\s*/).filter(Boolean);};
const govMulti=sel=>`<div class="govbox">${GOVS.map(g=>`<label class="govchk"><input type="checkbox" name="gov" value="${g}"${(sel||[]).includes(g)?" checked":""}>${g}</label>`).join("")}</div>`;
const govPick=f=>[...f.querySelectorAll('[name="gov"]:checked')].map(x=>x.value);
const nn=x=>+x||0;
const EXP_ITEMS=[["buses","الباصات / Buses","buses","bus_price","bus_cost"],["breakfast","الفطار / Breakfast","bf_qty","bf_price","breakfast"],["snacks","السناكس / Snacks","sn_qty","sn_price","snacks"],["meals","الوجبات / Meals","ml_qty","ml_price","meals"],["gifts","الهدايا / Gifts","gf_qty","gf_price","gifts"],["certs","الشهادات / Certificates","ct_qty","ct_price",null]];

const expLines=e=>{const L=[];EXP_ITEMS.forEach(([k,lb,q,pr,old])=>{const qty=nn(e[q]);let price=0,total=0;if(e[pr]!==undefined){price=nn(e[pr]);total=qty*price;}else if(old){total=nn(e[old]);}if(qty||total)L.push({k,lb,qty,price,total});});EXP_FLAT.forEach(([k,lb,f])=>{const v=nn(e[f]);if(v)L.push({k,lb,qty:0,price:0,total:v});});return L;};
const expTotal=e=>expLines(e).reduce((s,l)=>s+l.total,0);
const expsOf=(p,cn)=>(p.expenses||[]).filter(e=>e.caravan===cn);
const transOf=(p,cn)=>(p.transports||[]).filter(x=>x.caravan===cn);
const cvMetaOf=(p,cn)=>(p.caravans||[]).find(c=>c.name===cn)||{};
const cvExpSum=(p,cn)=>expsOf(p,cn).reduce((s,e)=>s+expTotal(e),0);
const cvTransSum=(p,cn)=>transOf(p,cn).reduce((s,x)=>s+nn(x.amount),0);
const cvGrand=(p,cn)=>cvExpSum(p,cn)+cvTransSum(p,cn);
const cvAgg=(p,cn)=>{const m={};expsOf(p,cn).forEach(e=>expLines(e).forEach(l=>{const a=m[l.k]||(m[l.k]={lb:l.lb,qty:0,total:0});a.qty+=l.qty;a.total+=l.total;}));return Object.values(m);};
const pSum=(p,k)=>(p.caravans||[]).reduce((s,c)=>s+nn(c[k]),0);
const pGrand=p=>(p.expenses||[]).reduce((s,e)=>s+expTotal(e),0)+(p.transports||[]).reduce((s,x)=>s+nn(x.amount),0);

function volTableHtml(vols,cn,p,dc){if(!vols.length)return '<p class="muted">'+t("no_data")+'</p>';return '<table class="data-table"><thead><tr><th>'+t("code")+'</th><th>'+t("name")+'</th><th>'+t("phone")+'</th><th>'+t("national_id")+'</th><th>'+(lang==="ar"?"الدور / Role":"Role")+'</th><th>📱</th><th></th></tr></thead><tbody>'+vols.map(v=>'<tr><td>'+esc(v.code||"-")+'</td><td>'+esc(v.full_name)+'</td><td dir="ltr">'+esc(v.phone||"-")+'</td><td dir="ltr">'+esc(v.national_id||"-")+'</td><td><select class="vol-role" data-vid="'+v.id+'" data-pid="'+p.id+'" data-cn="'+esc(cn)+'" style="font-size:.8rem;padding:4px;border-radius:6px;border:1px solid var(--border)"><option value="">'+(lang==="ar"?"— اختر —":"Select")+'</option>'+CONVOY_ROLES.map(r=>'<option value="'+esc(r)+'"'+(roleOf(v,p.id,cn)===r?' selected':'')+'>'+esc(r)+'</option>').join("")+'</select></td><td><a href="https://wa.me/2'+esc(v.phone||"").replace(/^0/,"")+"?text="+encodeURIComponent("السلام عليكم "+v.full_name+"\nقافلة: "+cn+"\nالدور: "+(roleOf(v,p.id,cn)||"متطوع")+"\nمسؤول المتطوعين: "+(((p.caravans||[]).find(cv=>cv.name===cn)||{}).supervisor||"")+"\nشكراً لمشاركتك 🤝")+'" target="_blank" style="font-size:1.2rem;text-decoration:none" title="WhatsApp">📱</a></td><td>'+(canEditProject(p.id)?'<button class="btn-danger-sm" data-cvrm="'+v.id+'" data-pid="'+p.id+'" data-cn="'+esc(cn)+'" title="إزالة من القافلة">✕</button>':'')+'</td></tr>').join("")+"</tbody></table>";}

function clSheetData(c,ym){const days=clDays(c).filter(d=>(d.date||"").startsWith(ym)).sort((a,b)=>a.date.localeCompare(b.date));const vmap={};cvList().forEach(v=>vmap[v.id]=v);const ids=[];cvOfClinic(c.id).forEach(v=>ids.push(v.id));days.forEach(d=>(d.vols||[]).forEach(x=>{if(!ids.includes(x.vid))ids.push(x.vid);}));const rows=ids.map(id=>{const v=vmap[id]||{name:"(محذوف)"};const am=days.map(d=>{const x=(d.vols||[]).find(y=>y.vid===id);return x&&nn(x.amount)?nn(x.amount):"";});return{v,am,total:am.reduce((s,a)=>s+nn(a),0)};});const dayTot=days.map((d,i)=>rows.reduce((s,r)=>s+nn(r.am[i]),0));const mgr=days.map(d=>nn(d.mgr&&d.mgr.amount)||"");return{days,rows,dayTot,mgr,volTotal:dayTot.reduce((a,b)=>a+b,0),mgrTotal:mgr.reduce((s,a)=>s+nn(a),0)};}
function parseClinicWorkbook(wb){const out=[];const cnt={};wb.SheetNames.forEach(sn=>{XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null}).forEach(r=>{if(r&&String(r[0]||"").includes("اسم المتطوع"))for(let j=5;j<r.length;j++){const x=r[j];if(typeof x==="number"&&x>40000){const dd=new Date(Math.round((x-25569)*86400000));const k=dd.getUTCFullYear()+"-"+(dd.getUTCMonth()+1);cnt[k]=(cnt[k]||0)+1;}}});});const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||"";const mainY=+top.split("-")[0]||new Date().getFullYear(),mainM=+top.split("-")[1]||7;const normDate=x=>{let y,mo,d;if(typeof x==="number"&&x>40000){const dd=new Date(Math.round((x-25569)*86400000));y=dd.getUTCFullYear();mo=dd.getUTCMonth()+1;d=dd.getUTCDate();if(mo!==mainM&&d===mainM){const t0=mo;mo=d;d=t0;}}else if(typeof x==="string"){const m=x.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);if(!m)return null;d=+m[1];mo=+m[2];y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):mainY;}else return null;if(mo<1||mo>12||d<1||d>31)return null;return y+"-"+pad2(mo)+"-"+pad2(d);};wb.SheetNames.forEach(sn=>{const ws=wb.Sheets[sn];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});const merges=ws["!merges"]||[];const vols=[],sigs=[],dates=[],seen=new Map();let cur=null;for(let i=0;i<rows.length;i++){const r=rows[i]||[];if(String(r[0]||"").includes("اسم المتطوع")){const sp=(rows[i+1]||[]).slice();merges.forEach(m=>{if(m.s.r===i+1&&m.e.r===i+1){const v=sp[m.s.c];for(let cc=m.s.c;cc<=m.e.c;cc++)sp[cc]=v;}});cur=[];for(let j=5;j<r.length;j++){const x=r[j];const dt=normDate(x);if(dt){const sponsor=sp[j]?String(sp[j]).trim():"";cur.push({col:j,date:dt});if(!dates.some(d=>d.date===dt))dates.push({date:dt,sponsor});}}continue;}if(!cur)continue;if(/الاجمالي|الإجمالي/.test(String(r[4]||"")))continue;const name=r[0]?String(r[0]).trim():"";const title=r[3]?String(r[3]).trim():"";if(!name){if(title&&r[1]&&/مدير|مسؤول|مسئول/.test(title))sigs.push({title,name:String(r[1]).trim()});continue;}const amounts={};cur.forEach(d=>{const a=r[d.col];if(typeof a==="number"&&a>0)amounts[d.date]=(amounts[d.date]||0)+a;});const nid=r[1]!=null?String(r[1]).trim():"";const key=nid||name;if(seen.has(key)){const o=seen.get(key);Object.keys(amounts).forEach(k=>{o.amounts[k]=(o.amounts[k]||0)+amounts[k];});continue;}const v={name,nid,acc:r[2]!=null?String(r[2]).trim():"",bank:r[3]?String(r[3]).trim():"",job:r[4]?String(r[4]).trim():"",amounts};seen.set(key,v);vols.push(v);}if(vols.length||dates.length)out.push({sheet:sn.trim(),dates,vols,sigs});});return out;}
async function doClinicImport(buf){const wb=XLSX.read(buf,{type:"array"});const parsed=parseClinicWorkbook(wb);if(!parsed.length){setFlash(lang==="ar"?"لم يتم العثور على شيتات بالفورمة المطلوبة":"No valid sheets found","error");render();return;}const list=cvList().map(v=>Object.assign({},v,{clinics:(v.clinics||[]).slice()}));const sponsors=new Set(cvDoc().sponsors||[]);const byNid=new Map(),byName=new Map();list.forEach(v=>{if(v.national_id)byNid.set(v.national_id,v);byName.set((v.name||"").trim(),v);});let nC=0,nV=0,nD=0;for(const s of parsed){const latin=/[A-Za-z]/.test(s.sheet);const name=latin?s.sheet:"عيادة "+s.sheet;let c=state.clinics.find(x=>(x.name||"").trim()===name);if(!c){c=await restAdd("clinics",{name,governorate:latin?null:s.sheet,city:null,days:[],signatures:[]});state.clinics.push(c);nC++;}s.vols.forEach(x=>{let v=(x.nid&&byNid.get(x.nid))||byName.get(x.name);if(!v){v={id:uid(),name:x.name,national_id:x.nid||"",account_number:x.acc,bank:x.bank,job:x.job||"متطوع",phone:"",contract_text:"",contract_files:[],clinics:[]};list.push(v);if(v.national_id)byNid.set(v.national_id,v);byName.set(v.name,v);nV++;}else{if(!v.account_number&&x.acc)v.account_number=x.acc;if(!v.bank&&x.bank)v.bank=x.bank;if(!v.job&&x.job)v.job=x.job;}if(!v.clinics.includes(c.id))v.clinics.push(c.id);x.vid=v.id;});const days=clDays(c).slice();s.dates.forEach(d=>{const old=days.find(y=>y.date===d.date);const vols=s.vols.filter(x=>x.amounts[d.date]).map(x=>({vid:x.vid,amount:x.amounts[d.date]}));if(d.sponsor)sponsors.add(d.sponsor);const rec={date:d.date,sponsor:d.sponsor,rate:100,vols,mgr:old?old.mgr||null:null,attachments:old?old.attachments||[]:[]};if(old)Object.assign(old,rec);else days.push(rec);nD++;});days.sort((a,b)=>a.date.localeCompare(b.date));const sig=SIG_TITLES.map((t,i)=>({title:t,name:(c.signatures&&c.signatures[i]&&c.signatures[i].name)||""}));s.sigs.forEach(g=>{sig[sigSlot(g.title)].name=g.name;});await restUpdate("clinics",c.id,{days,signatures:sig});c.days=days;c.signatures=sig;}await saveCvDoc({list,sponsors:[...sponsors]});await done((lang==="ar"?"تم الاستيراد: ":"Imported: ")+nC+(lang==="ar"?" عيادة جديدة، ":" new clinics, ")+nV+(lang==="ar"?" متطوع جديد، ":" new volunteers, ")+nD+(lang==="ar"?" يوم":" days"));}
function parseVolDb(wb){const out=[];wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});let h=-1;for(let i=0;i<Math.min(rows.length,10);i++){if((rows[i]||[]).some(x=>/id\s*number|رقم\s*قومي/i.test(String(x||"")))){h=i;break;}}if(h<0)return;const col={};(rows[h]||[]).forEach((x,j)=>{const s=String(x||"").toLowerCase().replace(/\s+/g," ").trim();if(!s)return;const set=k=>{if(col[k]==null)col[k]=j;};if(/id number|رقم قومي/.test(s))set("nid");else if(/^name|^الاسم/.test(s))set("name");else if(/title|الوظيفة/.test(s))set("job");else if(/address|العنوان/.test(s))set("addr");else if(/mobile|phone|تليفون|موبايل/.test(s))set("phone");else if(/payment/.test(s))set("pay");else if(/bank name|^البنك/.test(s))set("bank");else if(/account|حساب/.test(s))set("acc");else if(/governorate|محافظة/.test(s))set("gov");else if(/manager|مدير/.test(s))set("mgr");else if(/contract|عقد/.test(s))set("contract");});for(let i=h+1;i<rows.length;i++){const r=rows[i]||[];const g=k=>col[k]!=null&&r[col[k]]!=null?String(r[col[k]]).trim():"";const name=g("name");if(!name)continue;let ph=g("phone").replace(/\D/g,"");if(ph&&!ph.startsWith("0")&&ph.length===10)ph="0"+ph;out.push({name,nid:g("nid").replace(/\s/g,""),job:g("job"),addr:g("addr"),phone:ph,pay:g("pay"),bank:g("bank"),acc:g("acc"),gov:g("gov"),mgr:g("mgr"),contract:g("contract")});}});return out;}
async function doVolDbImport(buf){const wb=XLSX.read(buf,{type:"array"});const rows=parseVolDb(wb);if(!rows.length){setFlash(lang==="ar"?"لم يتم العثور على بيانات بالفورمة المطلوبة":"No valid data found","error");render();return;}const list=cvList().map(v=>Object.assign({},v,{clinics:(v.clinics||[]).slice()}));const byNid=new Map(),byName=new Map();list.forEach(v=>{if(v.national_id)byNid.set(v.national_id,v);byName.set((v.name||"").trim(),v);});let nNew=0,nUpd=0;rows.forEach(x=>{let v=(x.nid&&byNid.get(x.nid))||byName.get(x.name);const fill=o=>{const m={national_id:x.nid,name:x.name,job:x.job,address:x.addr,phone:x.phone,payment_mode:x.pay,bank:x.bank,account_number:x.acc,gov_clinic:x.gov,manager:x.mgr,contract_status:x.contract};Object.keys(m).forEach(k=>{if(m[k])o[k]=m[k];});return o;};if(!v){v=fill({id:uid(),job:"متطوع",contract_text:"",contract_files:[],clinics:[]});list.push(v);if(v.national_id)byNid.set(v.national_id,v);byName.set(v.name,v);nNew++;}else{fill(v);nUpd++;}});await saveCvDoc({list});await done((lang==="ar"?"تم رفع القاعدة: ":"Database uploaded: ")+nNew+(lang==="ar"?" جديد، ":" new, ")+nUpd+(lang==="ar"?" تحديث":" updated"));}

function clReport(c,ed){

 const th=dt.days.map(d=>`<th>${fmtD(d)}</th>`).join("");const sp=dt.days.map(d=>`<td style="font-size:.7rem">${esc(d.sponsor||"")}</td>`).join("");

 const table=dt.days.length||dt.rows.length?`<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>${L("اسم المتطوع","Name")}</th><th>${L("الرقم القومي","ID")}</th><th>${L("رقم الحساب","Account")}</th><th>${L("البنك","Bank")}</th><th>${L("الوظيفة","Job")}</th>${th}<th>${L("الإجمالي","Total")}</th></tr><tr><td colspan="5" style="font-size:.72rem;color:var(--muted)">${L("الإسبونسر","Sponsor")}</td>${sp}<td></td></tr></thead><tbody>${rows}<tr style="font-weight:700;background:var(--soft)"><td colspan="5">${L("الإجمالي","Total")}</td>${dt.dayTot.map(x=>`<td>${x}</td>`).join("")}<td>${dt.volTotal}</td></tr><tr style="font-weight:700;background:#ffe0d6;color:#333"><td colspan="5">${L("بدل مسؤول العيادة","Clinic manager allowance")}</td>${dt.mgr.map(x=>`<td>${x}</td>`).join("")}<td>${dt.mgrTotal}</td></tr><tr style="font-weight:800;background:var(--primary);color:#fff"><td colspan="5">${L("الإجمالي الكلي","Grand total")}</td>${dt.days.map((d,i)=>`<td>${dt.dayTot[i]+nn(dt.mgr[i])}</td>`).join("")}<td>${dt.volTotal+dt.mgrTotal}</td></tr></tbody></table></div>`:`<p class="muted">${L("لا توجد بيانات","No data")}</p>`;
 const sig=SIG_TITLES.map((tt,i)=>{const g=(c.signatures||[])[i]||{};return `<label class="fld">${esc(g.title||tt)}<input name="sig${i}" value="${esc(g.name||"")}"></label>`;}).join("");
 return `<section class="panel"><h2>📊 ${L("تقرير بدلات العيادة","Clinic allowances report")}</h2><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><input type="month" id="clRepMonth" value="${ym}"><button class="btn-secondary" data-clxls="${c.id}">⬇ Excel</button><span class="muted" style="font-size:.8rem">${MONTHS_AR[m-1]} ${y}</span></div>${table}</section><section class="panel"><h2>✍️ ${L("أسماء التوقيعات (أسفل التقرير)","Signature names (report footer)")}</h2><fieldset ${ed?"":"disabled"} style="border:0;padding:0;margin:0"><form class="grid-form" data-clsig="${c.id}">${sig}${ed?`<button class="btn-primary" type="submit">💾 ${t("save")}</button>`:""}</form></fieldset></section>`;
}
function clinicDay(c,date){
 const ar=lang==="ar";const L=(a,e)=>ar?a+" / "+e:e;const ed=canEditClinic(c.id);
 const d=clDay(c,date)||{date,sponsor:"",rate:lastRate(c),vols:[],mgr:null,attachments:[]};
 const att={};(d.vols||[]).forEach(x=>att[x.vid]=x);const vmap={};cvList().forEach(v=>vmap[v.id]=v);
 const vs=[...cvOfClinic(c.id)];(d.vols||[]).forEach(x=>{if(!vs.some(v=>v.id===x.vid)&&vmap[x.vid])vs.push(vmap[x.vid]);});
 const sponsors=[...(cvDoc().sponsors||[])];if(d.sponsor&&!sponsors.includes(d.sponsor))sponsors.push(d.sponsor);
 const inDay=new Set((d.vols||[]).map(x=>x.vid));const linked=new Set(cvOfClinic(c.id).map(v=>v.id));const pool=cvList().filter(v=>!inDay.has(v.id)).sort((a,b)=>(linked.has(b.id)-linked.has(a.id))||(a.name||"").localeCompare(b.name||"","ar"));

 const poolHtml=pool.map(v=>`<div class="pool-item" draggable="true" data-poolvid="${v.id}" data-vname="${esc(v.name)}" data-vjob="${esc(v.job||"")}" data-vsearch="${esc(((v.name||"")+" "+(v.national_id||"")+" "+(v.gov_clinic||"")).toLowerCase())}"${linked.has(v.id)?' data-linked="1"':""}><span style="flex:1"><b>${esc(v.name)}</b>${linked.has(v.id)?` <span class="pill" style="font-size:.65rem">${L("العيادة","Clinic")}</span>`:""}<br><span class="muted" style="font-size:.72rem">${esc(v.national_id||"")} ${esc(v.gov_clinic||"")}</span></span><button type="button" class="btn-secondary" data-poolgo="${v.id}" style="padding:2px 8px">＋</button></div>`).join("");
 const title=new Date(date+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const rows=vs.map(v=>{const a=att[v.id];return `<tr><td><input type="checkbox" data-attvid="${v.id}" ${a?"checked":""} onchange="ibfAttToggle(this)"></td><td style="text-align:right">${esc(v.name)}</td><td>${esc(v.job||"")}</td><td><input name="amt_${v.id}" type="number" min="0" step="any" value="${a&&nn(a.amount)?nn(a.amount):""}" style="width:110px" placeholder="${L("بدون بدل","No allowance")}"></td></tr>`;}).join("");
 const files=(d.attachments||[]).map(f=>`<div data-att-url="${esc(f.url)}" data-att-name="${esc(f.name||"")}" style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--soft);border-radius:8px;margin-top:4px;font-size:.82rem"><a href="${esc(f.url)}" target="_blank" style="flex:1;color:var(--primary);text-decoration:none;font-weight:600">📄 ${esc(f.name||"file")}</a>${ed?`<button type="button" class="btn-danger-sm" onclick="this.parentElement.remove()">✕</button>`:""}</div>`).join("");
 return `<div class="detail-top"><button class="btn-ghost" data-clbackcal="1" style="color:var(--text);border-color:var(--border)">‹ ${esc(c.name)}</button></div><h1 class="page-title" style="margin:8px 0">📅 ${title}</h1>
 <form data-cldayform="${c.id}" data-date="${date}"><fieldset ${ed?"":"disabled"} style="border:0;padding:0;margin:0">
 <section class="panel"><h2>${L("بيانات اليوم","Day details")}</h2><div class="grid-form"><label class="fld">${L("الإسبونسر","Sponsor")}<select name="sponsor"><option value="">—</option>${sponsors.map(s=>`<option value="${esc(s)}"${s===d.sponsor?" selected":""}>${esc(s)}</option>`).join("")}</select></label><label class="fld">${L("إسبونسر جديد","New sponsor")}<div style="display:flex;gap:6px"><input name="newsponsor" placeholder="${L("اكتب الاسم","Type name")}"><button type="button" class="btn-secondary" data-addsponsor="1">＋</button></div></label><label class="fld">${L("بدل المتطوع (يتعبّى تلقائي)","Volunteer allowance (auto-fill)")}<input name="rate" type="number" min="0" step="any" value="${nn(d.rate)||lastRate(c)}"></label></div></section>
 <section class="panel"><h2>👥 ${L("حضور المتطوعين","Volunteer attendance")}</h2><div style="display:flex;flex-wrap:wrap;gap:12px">${ed?`<div style="flex:1 1 250px;min-width:230px"><b style="font-size:.85rem">📋 ${L("قاعدة المتطوعين — اسحب للحضور","Master data — drag to attendance")}</b><input id="dayPoolFilter" placeholder="${L("فلترة...","Filter...")}" style="width:100%;margin:6px 0"><button type="button" class="btn-secondary" id="dayAddLinked" style="margin-bottom:6px;font-size:.8rem">＋ ${L("كل متطوعي العيادة","All clinic volunteers")}</button><div id="dayPool" class="pool">${poolHtml}</div></div>`:""}<div id="dayDrop" class="dropzone" style="flex:2 1 360px"><b>✅ ${L("حضور هذا اليوم","Attendance for this day")} (<span id="dayAttCount">${(d.vols||[]).length}</span>)</b><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>${L("الاسم","Name")}</th><th>${L("الوظيفة","Job")}</th><th>${L("البدل","Allowance")}</th><th></th></tr></thead><tbody id="dayAttBody">${attRows}</tbody></table></div><p id="dayDropHint" class="muted" style="text-align:center;padding:14px 0">${ed?L("اسحب متطوع هنا أو اضغط ＋","Drag a volunteer here or press ＋"):L("لا يوجد حضور","No attendance")}</p></div></div></section>
 <section class="panel" style="border-right:4px solid #e2574c"><h2>👤 ${L("مسؤول العيادة","Clinic manager")}</h2><div class="grid-form"><label class="fld">${L("الاسم","Name")}<input name="mgr_name" value="${esc(d.mgr&&d.mgr.name||"")}"></label><label class="fld">${L("القيمة","Amount")}<input name="mgr_amount" type="number" min="0" step="any" value="${d.mgr&&nn(d.mgr.amount)?nn(d.mgr.amount):""}"></label></div></section>
 <section class="panel"><h2>📎 ${L("صورة / ملف كشف الحضور","Attendance sheet photo / file")}</h2><div>${files}</div>${ed?`<input type="file" name="dayfiles" accept="image/*,.pdf" multiple style="margin-top:8px;font-size:.82rem">`:""}</section>
 </fieldset>${ed?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn-primary" type="submit">💾 ${L("حفظ اليوم","Save day")}</button>${clDay(c,date)?`<button type="button" class="btn-danger-sm" data-cldelday="${c.id}|${date}">🗑 ${L("حذف اليوم","Delete day")}</button>`:""}</div>`:""}</form>`;
}

function viewEvents(){
 const govOpts='<option value="">'+t("select_gov")+'</option>'+GOVS.map(g=>'<option value="'+g+'">'+g+'</option>').join("");
 const statusColors={planned:'var(--accent)',active:'var(--primary)',done:'var(--primary-darker)',cancelled:'var(--danger)'};
 const typeIcons={convoy:'🚐',training:'📚',meeting:'📋',other:'📌'};
 const form=isAdmin()?`<section class="panel"><h2>＋ ${t("new_event")}</h2>

   <label class="fld">${t("event_name")}<input name="name" required></label>
   <label class="fld">${t("event_type")}<select name="type"><option value="convoy">${t("type_convoy")}</option><option value="training">${t("type_training")}</option><option value="meeting">${t("type_meeting")}</option><option value="other">${t("type_other")}</option></select></label>

   <label class="fld">${t("event_status")}<select name="status"><option value="planned">${t("status_planned")}</option><option value="active">${t("status_active")}</option><option value="done">${t("status_done")}</option><option value="cancelled">${t("status_cancelled")}</option></select></label>

 const cards=state.events.length?state.events.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(e=>{
  const icon=typeIcons[e.type]||'📌';const sColor=statusColors[e.status]||'var(--muted)';

  return `<div class="folder-card" style="cursor:default">
   <div class="folder-icon">${icon}</div>
   <div class="folder-body"><div class="folder-name">${esc(e.name)}</div>
    <div class="folder-sub">${e.date?esc(e.date)+" · ":""}${e.governorate?esc(e.governorate)+" · ":""}${e.location?esc(e.location)+" · ":""}<span style="background:${sColor};color:#fff;padding:2px 8px;border-radius:12px;font-size:.72rem">${sLabel}</span></div>
    ${e.description?`<div style="font-size:.8rem;color:var(--muted);margin-top:4px">${esc(e.description)}</div>`:""}</div>
   ${isAdmin()?`<select class="evt-status" data-eid="${e.id}" style="font-size:.75rem;padding:3px 6px;border-radius:6px;border:1px solid var(--border)"><option value="planned"${e.status==="planned"?" selected":""}>${t("status_planned")}</option><option value="active"${e.status==="active"?" selected":""}>${t("status_active")}</option><option value="done"${e.status==="done"?" selected":""}>${t("status_done")}</option><option value="cancelled"${e.status==="cancelled"?" selected":""}>${t("status_cancelled")}</option></select>

function showQR(pid,cname){const p=state.projects.find(x=>x.id===pid);if(!p)return;const car=cname||p.name;const base=settings.qrUrl||(location.protocol==='file:'?'https://hes12ham.github.io/IBF-project/qr-attendance.html':(location.origin+location.pathname.replace(/[^\/]*$/,'')+'qr-attendance.html'));const url=base+(base.includes("?")?"&":"?")+"project="+encodeURIComponent(pid)+"&caravan="+encodeURIComponent(car)+(p.village?"&village="+encodeURIComponent(p.village):"")+(p.qr_message?"&msg="+encodeURIComponent(p.qr_message):"");document.getElementById("qrTitle").textContent=car;document.getElementById("qrSub").textContent=t("scan_to_join");document.getElementById("qrUrl").textContent=url;const box=document.getElementById("qrBox");box.innerHTML="";if(typeof QRCode!=="undefined"){new QRCode(box,{text:url,width:220,height:220,colorDark:"#0b7ea3",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}else{box.innerHTML='<p class="muted">QR library not loaded</p>';}document.getElementById("qrOverlay").style.display="flex";}

function syncFromSheet(silent){const gurl=effGs();if(!gurl){if(!silent){setFlash(t("sync_off"),"error");render();}return;}if(_syncing)return;_syncing=true;const cb="__ibfCb"+Date.now();const cleanup=s=>{try{document.body.removeChild(s);}catch(e){}delete window[cb];_syncing=false;};const sc=document.createElement("script");const to=setTimeout(()=>{cleanup(sc);if(!silent){setFlash("Sync timeout","error");render();}},15000);window[cb]=resp=>{clearTimeout(to);mergeSubmissions(Array.isArray(resp)?resp:(resp&&resp.rows)||[]).then(()=>{_lastSync=Date.now();if(!silent){setFlash(t("sync_done"));fetchAll(false);}}).catch(e=>{if(!silent){setFlash("Sync error: "+e.message,"error");render();}});cleanup(sc);};const sep=gurl.includes("?")?"&":"?";sc.src=gurl+sep+"callback="+cb+(settings.gsToken?"&token="+encodeURIComponent(settings.gsToken):"");sc.onerror=()=>{clearTimeout(to);cleanup(sc);if(!silent){setFlash("تعذّر الاتصال بـ Apps Script","error");render();}};document.body.appendChild(sc);}
async function mergeSubmissions(rows){if(!rows||!rows.length)return;let list;if(!Array.isArray(rows[0])){list=rows.map(o=>{const g=f=>{const k=_findKey(o,FIELD_KW[f]);return k!=null?o[k]:null;};return{full_name:String(g("name")||"").trim(),code:g("code")!=null&&String(g("code")).trim()!==""?String(g("code")).trim():null,phone:g("phone")!=null&&String(g("phone")).trim()!==""?String(g("phone")).trim():null,national_id:g("national_id")!=null&&String(g("national_id")).trim()!==""?String(g("national_id")).trim():null,commitment_score:toInt(g("commitment")),project_id:null,caravan:g("caravan")!=null&&String(g("caravan")).trim()!==""?String(g("caravan")).trim():null,_ts:g("timestamp")!=null&&String(g("timestamp")).trim()!==""?String(g("timestamp")).trim():null,email:g("email")!=null&&String(g("email")).trim()!==""?String(g("email")).trim():null};}).filter(x=>x.full_name);}else{list=parseVolunteerSheet(rows).map(x=>Object.assign({project_id:null,caravan:null,_ts:null},x));}for(const p of list){let v=state.volunteers.find(x=>(p._ts&&x._ts===p._ts)||(p.code&&x.code===p.code)||(p.national_id&&x.national_id===p.national_id));if(!v){const code=p.code||await nextCode();await restAdd('volunteers',{full_name:p.full_name,code,phone:p.phone||null,national_id:p.national_id||null,commitment_score:p.commitment_score??null,project_id:p.project_id||null,caravan:p.caravan||null,_ts:p._ts||null,email:p.email||null,participations:(p.project_id!=null||p.caravan)?[{_k:(p._ts||"")+"_"+(p.project_id||"")+"_"+(p.caravan||""),project_id:p.project_id||null,caravan:p.caravan||null,date:p._ts||new Date().toISOString()}]:[]});}else{const patch={};if(p.project_id!=null&&v.project_id!==p.project_id)patch.project_id=p.project_id;if(p.caravan&&v.caravan!==p.caravan)patch.caravan=p.caravan;if(p.email&&!v.email)patch.email=p.email;if(p.project_id!=null||p.caravan){const pk=(p._ts||"")+"_"+(p.project_id||"")+"_"+(p.caravan||"");const parts=Array.isArray(v.participations)?v.participations:[];if(!parts.some(x=>x._k===pk))patch.participations=[...parts,{_k:pk,project_id:p.project_id,caravan:p.caravan||null,date:p._ts||new Date().toISOString()}];}if(Object.keys(patch).length)await restUpdate('volunteers',v.id,patch);}}}

function renderRegister(qp){const project=qp.get("project")||"";const caravan=qp.get("caravan")||"";document.documentElement.lang="ar";document.documentElement.dir="rtl";document.documentElement.setAttribute("data-theme","light");document.getElementById("app").innerHTML=`<div class="auth-wrap"><div class="auth-card"><img class="auth-logo" src="${LOGO}" alt="IBF"><h1>${lang==="ar"?"تسجيل حضور":"Log attendance"}</h1>${caravan?`<div style="display:inline-block;background:rgba(23,189,239,.12);color:var(--primary-darker);border:1px solid rgba(23,189,239,.4);border-radius:30px;padding:6px 16px;font-weight:700;margin:10px 0 6px">${lang==="ar"?"قافلة":"Caravan"}: ${esc(caravan)}</div>`:""}<form id="regForm" style="margin-top:14px"><label>${lang==="ar"?"أدخل الكود الخاص بك":"Enter your code"} *</label><input name="code" required placeholder="V0001" dir="ltr" id="codeInput" autocomplete="off" style="text-align:center;font-size:1.3rem;letter-spacing:3px;font-weight:700"><div id="codePrev" style="min-height:26px;text-align:center;font-size:.9rem;color:var(--muted);padding:4px 0"></div><div id="regErr" class="flash flash-error" style="display:none"></div><button class="btn-primary" type="submit" id="regBtn">${lang==="ar"?"تسجيل الحضور":"Log attendance"}</button></form><p class="muted" style="font-size:.8rem;margin-top:10px">${lang==="ar"?"ليس لديك كود؟ سجّل حساب جديد أولًا من صفحة الدخول.":"No code? Register first."}</p></div></div>`;const gsUrl=qp.get("gs")||effGs();let _lookupCache=null,_debT=null;const ci=document.getElementById("codeInput");const prev=document.getElementById("codePrev");function lookupCode(code,cb){if(!gsUrl){cb(null);return;}if(_lookupCache){cb(_lookupCache.find(r=>String(r.code||"").trim().toUpperCase()===code)||null);return;}const cn="__ibfPrev"+Date.now();const sc=document.createElement("script");const cl=()=>{try{document.body.removeChild(sc);}catch(_){}delete window[cn];};const to=setTimeout(()=>{cl();cb(null);},10000);window[cn]=rows=>{clearTimeout(to
